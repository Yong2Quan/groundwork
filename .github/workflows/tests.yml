name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # setup-python rather than uv: uv is the documented local workflow,
      # but `uv pip install --system` targets /usr, which is PEP 668
      # externally-managed on ubuntu-latest and refuses to install. The
      # interpreter setup-python provides is not externally managed.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,dev]"

      - name: Versions
        run: |
          python --version
          python -c "import mcp, pydantic, importlib.metadata as m; print('mcp', m.version('mcp')); print('pydantic', m.version('pydantic'))"

      # The corpus is committed, but it is also generated. Regenerating and
      # diffing proves the generator is deterministic and that the data in
      # the repo is what the script actually produces.
      - name: Corpus is reproducible from the generator
        run: |
          python scripts/generate_data.py
          git diff --exit-code -- data/

      # Validity gates before anything else: if a ticket leaks its own
      # answer, the results table is measuring nothing.
      - name: Validity checks
        run: python -m triage.cli analyze

      - name: Tests
        run: pytest -q

      # No model, no network, no cost - proves the harness runs end to end.
      - name: Rules-only control sweep
        run: python -m triage.cli run --provider offline --arms baseline --out /tmp/ci-control.json

      - name: Reports render
        run: |
          python -m triage.cli report results/runs/sweep-sonnet.json
          python -m triage.cli economics results/runs/sweep-sonnet.json
          python -m triage.cli compare results/runs/sweep-sonnet.json results/runs/sweep-haiku.json
