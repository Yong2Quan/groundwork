[project]
name = "groundwork"
version = "0.1.0"
description = "Incident-triage agent with an eval harness comparing LLM-alone, RAG-only and MCP-agent configurations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Needed only to run the MCP server and the agent configuration.
# Upper bound deliberate: the 1.x -> 2.x rename (FastMCP -> MCPServer,
# inputSchema -> input_schema) broke this build during development. A 3.x
# could do the same to anyone cloning this later.
mcp = ["mcp>=2.0,<3"]
# Needed only for the `anthropic` provider (direct API key / Bedrock).
api = ["anthropic>=0.69,<2"]
dev = ["pytest>=8.0"]

[project.scripts]
triage = "triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
